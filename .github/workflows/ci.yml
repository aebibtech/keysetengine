name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_NOLOGO: "true"

jobs:
  format-and-audit:
    name: Code Style & Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Verify Code Formatting
        run: dotnet format KeysetEngine.sln --verify-no-changes

      - name: Check Transitive Vulnerabilities
        run: dotnet list KeysetEngine.sln package --vulnerable --include-transitive

  unit-tests:
    name: Unit Tests (All TFMs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDKs (8.0, 9.0, 10.0)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore Dependencies
        run: dotnet restore KeysetEngine.sln

      - name: Build Solution
        run: dotnet build KeysetEngine.sln -c Release --no-restore

      - name: Run Unit Tests
        run: dotnet test tests/KeysetEngine.Tests.Unit/KeysetEngine.Tests.Unit.csproj -c Release --no-build --collect:"XPlat Code Coverage"

      - name: Upload Test Coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unit-test-coverage
          path: tests/KeysetEngine.Tests.Unit/TestResults/*/coverage.cobertura.xml
          retention-days: 14

  integration-tests:
    name: Integration Tests (Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDKs (8.0, 9.0, 10.0)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore Dependencies
        run: dotnet restore KeysetEngine.sln

      - name: Build Solution
        run: dotnet build KeysetEngine.sln -c Release --no-restore

      - name: Run Integration Tests (PostgreSQL, MSSQL, SQLite)
        run: dotnet test tests/KeysetEngine.Tests.Integration/KeysetEngine.Tests.Integration.csproj -c Release --no-build

  pack-verification:
    name: Package Build & Validation
    runs-on: ubuntu-latest
    needs: [ format-and-audit, unit-tests, integration-tests ]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDKs (8.0, 9.0, 10.0)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore Dependencies
        run: dotnet restore KeysetEngine.sln

      - name: Build Release
        run: dotnet build KeysetEngine.sln -c Release --no-restore

      - name: Pack NuGet Packages
        run: dotnet pack KeysetEngine.sln -c Release --no-build --output ./artifacts

      - name: Verify Package Count
        run: |
          NUPKG_COUNT=$(ls -1 ./artifacts/*.nupkg 2>/dev/null | wc -l)
          SNUPKG_COUNT=$(ls -1 ./artifacts/*.snupkg 2>/dev/null | wc -l)
          echo "Found $NUPKG_COUNT .nupkg packages and $SNUPKG_COUNT .snupkg symbol packages."
          if [ "$NUPKG_COUNT" -ne 4 ] || [ "$SNUPKG_COUNT" -ne 4 ]; then
            echo "Error: Expected exactly 4 .nupkg and 4 .snupkg files."
            exit 1
          fi

      - name: Upload Package Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages-dryrun
          path: ./artifacts/*
          retention-days: 7
